name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:apps-script
      - run: bash -n local/run_canvas_sync.sh apps-script/tools/deploy_apps_script.sh

  local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local/requirements.txt
      - run: python -m pip install -r local/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
